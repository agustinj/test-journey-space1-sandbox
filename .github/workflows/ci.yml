name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ToolShop
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-selfhost

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Levantar ToolShop
        working-directory: toolshop-selfhost
        run: docker compose -f docker-compose.prod.yml up --pull missing -d

      - name: Migrar y sembrar la base de datos
        working-directory: toolshop-selfhost
        run: docker exec pst-laravel-api-1 php artisan migrate:fresh --seed